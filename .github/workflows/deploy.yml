name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Минимальные права по умолчанию; разрешения Pages выдаются только deploy-job.
permissions:
  contents: read

# Для PR новый коммит отменяет устаревший прогон; для main — нет: каждая публикация
# должна дойти до конца (отменённая публикация могла бы оставить Pages в промежуточном состоянии).
concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Ключи Supabase. Значения ищутся в таком порядке:
      #   1. Secrets репозитория (Settings → Secrets and variables → Actions → Secrets)
      #   2. Variables репозитория (там же, вкладка Variables)
      #   3. URL проекта — значение по умолчанию ниже (URL публичный, как в README)
      # Если anon-ключ не найден — деплой обрывается с понятной ошибкой,
      # иначе на Pages уехала бы сборка в демо-режиме без регистрации.
      - name: Проверить ключи Supabase
        if: github.event_name != 'pull_request'
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || vars.VITE_SUPABASE_URL || 'https://dcgurmwvpgzmlfivxoso.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          FAIL=0
          if [ -z "$VITE_SUPABASE_URL" ]; then
            echo "::error title=Не задан VITE_SUPABASE_URL::Добавьте его в Settings → Secrets and variables → Actions (Secrets или Variables)."
            FAIL=1
          elif ! [[ "$VITE_SUPABASE_URL" == https://* ]] || [[ "$VITE_SUPABASE_URL" == *your-project-ref* ]]; then
            echo "::error title=Некорректный VITE_SUPABASE_URL::Ожидался адрес вида https://<project-ref>.supabase.co (Settings → API в дашборде Supabase)."
            FAIL=1
          fi
          if [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "::error title=Не задан VITE_SUPABASE_ANON_KEY::Добавьте publishable (anon) ключ проекта в Settings → Secrets and variables → Actions → Secrets (или Variables). Взять: Supabase Dashboard → Project Settings → API → Project API keys → anon/publishable."
            FAIL=1
          fi
          if [ "$FAIL" -ne 0 ]; then
            echo "Деплой отменён: без ключей Supabase сайт публикуется без работающей регистрации."
            exit 1
          fi

      - name: Check and build
        run: npm run check
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || vars.VITE_SUPABASE_URL || 'https://dcgurmwvpgzmlfivxoso.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || vars.VITE_SUPABASE_ANON_KEY }}
          # Имя бота и HTTPS URL его API не являются секретами — GitHub Actions Variables.
          VITE_TELEGRAM_BOT_USERNAME: ${{ vars.VITE_TELEGRAM_BOT_USERNAME }}
          VITE_TELEGRAM_API_URL: ${{ vars.VITE_TELEGRAM_API_URL }}

      # E2E Telegram Mini App в настоящем Chrome (предустановлен на раннере ubuntu-24.04):
      # обычный браузер, запуск из Telegram, BackButton, viewport/safe area, deep links,
      # отказ SDK, ширина 320 px. Без браузера шаг падает (E2E_REQUIRED=1).
      - name: E2E Telegram Mini App
        run: npm run e2e
        env:
          E2E_REQUIRED: '1'

      - name: Сохранить скриншоты E2E
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: e2e-screenshots
          path: node_modules/.tmp/e2e/
          if-no-files-found: ignore
          retention-days: 7

      - name: Setup Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ./dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
