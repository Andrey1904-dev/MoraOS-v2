name: Telegram bot — Mini App setup

# Ручной запуск: Actions → «Telegram bot — Mini App setup» → Run workflow.
# Секреты (Settings → Secrets and variables → Actions):
#   TELEGRAM_BOT_TOKEN      — токен из @BotFather (обязателен)
#   SUPABASE_ACCESS_TOKEN   — только для режима full + deploy
#   TELEGRAM_WEBHOOK_SECRET — секрет вебхука; обязателен для режима full без deploy
#                             (тот же, что записан у функции telegram-api)
# Переменные (вкладка Variables):
#   WEB_APP_URL             — HTTPS-адрес сайта; по умолчанию адрес GitHub Pages этого репозитория
#   SUPABASE_PROJECT_REF    — ref проекта Supabase; по умолчанию проект из README
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'menu — только кнопка меню Mini App; full — webhook, описание, команды и кнопка меню'
        type: choice
        options: [menu, full]
        default: menu
      deploy:
        description: 'full: заодно развернуть Edge Function telegram-api и её секреты'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: telegram-bot-setup
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-24.04
    environment: telegram-bot
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Проверки скрипта и ядра бота без реального токена — до обращения к Telegram.
      - name: Проверить скрипт настройки
        run: npm run bot:test && node scripts/smoke-telegram-setup.mjs

      - name: Настроить бота
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          WEB_APP_URL: ${{ vars.WEB_APP_URL || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
          # Ref проекта Supabase (не секрет). Без него скрипт не знает, какую функцию настраивать.
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || 'dcgurmwvpgzmlfivxoso' }}
          # Секрет вебхука должен совпадать с секретом функции (без --deploy он обязан быть задан).
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          MODE: ${{ inputs.mode }}
          DEPLOY: ${{ inputs.deploy }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "::error title=Нет TELEGRAM_BOT_TOKEN::Добавьте секрет TELEGRAM_BOT_TOKEN (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          echo "::add-mask::$TELEGRAM_BOT_TOKEN"
          if [ "$MODE" = "menu" ]; then
            node scripts/telegram-bot-setup.mjs --menu-only
          elif [ "$DEPLOY" = "true" ]; then
            node scripts/telegram-bot-setup.mjs --deploy
          else
            node scripts/telegram-bot-setup.mjs
          fi
